name: Build and Publish HRV Card

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: hrv-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for release uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            BUILD_TYPE="release"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="main-${GITHUB_SHA::7}"
            BUILD_TYPE="branch"
          else
            VERSION="pr-${GITHUB_SHA::7}"
            BUILD_TYPE="pr"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: Inject version
        run: |
          echo "export const VERSION = '${{ steps.version.outputs.version }}';" > src/version.js

      - name: Type check
        run: npm run typecheck

      - name: Lint (if available)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Validate output
        run: test -f dist/hrv-card.js

      - name: HACS validation (PR only)
        if: github.event_name == 'pull_request'
        uses: hacs/action@main
        with:
          category: plugin

      # -----------------------------
      # RELEASE PUBLISH (NO ARTIFACTS)
      # -----------------------------
      - name: Generate checksum (release only)
        if: github.event_name == 'release'
        run: sha256sum dist/hrv-card.js > dist/checksums.txt

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hrv-card.js
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}