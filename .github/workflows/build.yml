name: Build and Publish HRV Card

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hrv-card
          path: dist/hrv-card.js

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hrv-card

      - name: Upload release asset
        run: gh release upload ${{ github.event.release.tag_name }} hrv-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}